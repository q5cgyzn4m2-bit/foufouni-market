# Configuration automatique de foûfoûni-Market sur Render (New > Blueprint)
# Offre gratuite : les données sont enregistrées dans Supabase.
services:
  - type: web
    name: foufouni-market
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Gérant
      - key: DATABASE_URL
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
