function partyDetail(type, id, fresh){
  const isC = type==='client', x = fresh ? {id,...fresh} : (isC?S.clients:S.suppliers).find(p=>p.id===id); if(!x) return;
  const due = partyBalance(type, id);
  const entries = S.ledger.filter(l=>l.partyType===type && l.partyId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.createdAt-a.createdAt);
  const orders = isC ? S.orders.filter(o=>o.clientId===id).slice(0,20) : [];
  $('#overlay').innerHTML = `<div class="scrim" data-a="closeAll"><div class="modal wide" role="dialog" aria-modal="true" aria-label="${esc(x.name)}">
    <div class="m-h"><h2>${esc(x.name)}</h2><button class="x" data-a="closeAll" aria-label="Fermer">×</button></div>
    <div class="m-b"><div class="two"><div>
      <div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><span>Solde dû</span><b style="color:${due>0?(isC?'var(--indigo)':'var(--danger)'):'inherit'}">${fmt(Math.max(0,due))}</b>${due<0?`<span class="small">Avance : ${fmt(-due)}</span>`:''}</div>
      <div class="kpi"><span>${isC?'Achats en boutique':'Factures enregistrées'}</span><b>${isC?orders.length:entries.filter(e=>e.kind==='facture').length}</b></div></div>
      <div class="fin-actions">${isC
        ? `<button class="btn primary" data-pd="pay">Encaisser un règlement</button><button class="btn ghost" data-pd="bill">Ajouter une créance</button>`
        : `<button class="btn primary" data-pd="pay">Régler le fournisseur</button><button class="btn ghost" data-pd="bill">Enregistrer une facture d’achat</button>`}</div>
      <div class="panel tbl-wrap"><h3>Historique</h3>${entries.length?`<table><thead><tr><th>Date</th><th>Libellé</th><th style="text-align:right">${isC?'Dû':'Facturé'}</th><th style="text-align:right">Réglé</th><th></th></tr></thead><tbody>
        ${entries.map(e=>`<tr><td class="small" style="white-space:nowrap">${dateOnly(e.date)}</td><td class="small">${esc(e.label)}${e.ref?`<div class="muted">${esc(e.ref)}</div>`:''}${(()=>{ const oi = isC && e.kind==='facture' ? openInvoices(id).find(i=>i.f.id===e.id) : null; const dd = e.due || (isC&&e.kind==='facture'?addDays(e.date,termDays()):''); if(!dd) return ''; if(isC && e.kind==='facture' && !oi) return `<div class="muted">Échéance ${dateOnly(dd)} · soldée</div>`; const late = oi && dd<=today(); return `<div class="muted">Échéance ${dateOnly(dd)}${oi?` · reste ${fmt(oi.rem)}`:''}</div>${late?`<span class="pill bad">En retard de ${daysBetween(dd,today())} j</span>`:''}`; })()}</td>
          <td style="text-align:right">${e.kind==='facture'?fmt(e.amount):''}</td><td style="text-align:right" class="amt-in">${e.kind==='reglement'?fmt(e.amount):''}</td><td><button class="btn sm ghost" data-pd="delEntry" data-id="${e.id}" aria-label="Supprimer">×</button></td></tr>`).join('')}</tbody></table>`
        :'<p class="muted">Aucune opération pour l’instant.</p>'}</div></div>
    <div><div class="panel"><h3>Coordonnées</h3><p style="margin:0">${esc(x.phone||'—')}${x.email?`<br>${esc(x.email)}`:''}${x.address?`<br>${esc(x.address)}`:''}${x.products?`<br><span class="muted">Fournit : ${esc(x.products)}</span>`:''}${x.note?`<br><span class="muted">${esc(x.note)}</span>`:''}</p>
      <div class="row" style="margin-top:12px">${x.phone?`<a class="btn ghost sm" href="tel:${esc(x.phone.replace(/\s/g,''))}" style="flex:0">Appeler</a>`:''}<button class="btn ghost sm" data-pd="edit" style="flex:0">Modifier</button>${due===0&&!entries.length?'<button class="btn danger sm" data-pd="delParty" style="flex:0">Supprimer</button>':''}</div></div>
    ${isC&&orders.length?`<div class="panel"><h3>Derniers achats</h3>${orders.map(o=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span class="small" style="flex:1">${esc(o.number)} · ${dateFr(o.createdAt)}</span><b class="small" style="flex:0;white-space:nowrap">${fmt(o.total)}</b></div>`).join('')}</div>`:''}</div></div></div></div></div>`;
  $('#overlay').querySelectorAll('[data-pd]').forEach(b=>b.onclick = async e=>{
    e.stopPropagation(); const a = b.dataset.pd;
    if(a==='edit') partyForm(type, x);
    if(a==='pay') finForm(isC?'reg_client':'reg_fournisseur', {partyId:id, amount:due>0?due:''});
    if(a==='bill') billForm(type, x);
    if(a==='delParty'){ if(!confirmTwice(b)) return; try{ await del(isC?'clients':'suppliers', id); closeAll(); toast('Fiche supprimée'); }catch(err){ dbErr(err); } }
    if(a==='delEntry'){ if(!confirmTwice(b)) return; const en = S.ledger.find(l=>l.id===b.dataset.id);
      try{ await del('fin-ledger', en.id); if(en.moveId) await del('fin-moves', en.moveId); toast('Opération supprimée'); setTimeout(()=>partyDetail(type,id),300); }catch(err){ dbErr(err); } }
  });
}
function billForm(type, x){
  const isC = type==='client';
  if(isC && (!x.name || !phoneOk(x.phone))){
    $('#overlay').innerHTML = `<div class="scrim" data-a="closeAll"><div class="modal" role="dialog" aria-modal="true" aria-label="Numéro requis"><div class="m-h"><h2>Numéro de téléphone requis</h2><button class="x" data-a="closeAll" aria-label="Fermer">×</button></div>
      <div class="m-b"><p style="margin:0">Pour enregistrer une créance, la fiche de <b>${esc(x.name||'ce client')}</b> doit comporter un nom et un numéro de téléphone valide.</p></div>

    <div class="small" id="bl-err" style="color:var(--danger)"></div></div>
    <div class="m-f"><button class="btn ghost" data-a="closeAll">Annuler</button><button class="btn primary" id="bl-save">Enregistrer</button></div></div></div>`;

  $('#bl-save').onclick = async ()=>{
    const v = id=>($(id)?.value||'').trim(), amt = Number(v('#bl-amt').replace(/\s/g,''));
    if(!(amt>0)){ $('#bl-err').textContent='Indiquez un montant supérieur à zéro.'; return; }
    try{ await put('fin-ledger', newId('l'), {partyType:type, partyId:x.id, kind:'facture', amount:amt, label:v('#bl-label')||(isC?'Créance':'Facture d’achat'), date:v('#bl-date')||today(), ref:v('#bl-ref'), due:v('#bl-due'), createdAt:Date.now(), createdBy:S.uid||'local'});
      toast('Enregistré'); setTimeout(()=>partyDetail(type, x.id), 300); }catch(e){ dbErr(e); $('#bl-err').textContent='Enregistrement impossible.'; }
  };
}

/* --- Gestion --- */
const TABS = [['dash','Tableau de bord'],['products','Produits'],['bundles','Lots'],['orders','Commandes'],['promos','Codes promo'],['payments','Paiements'],['team','Équipe']];
function viewAdmin(){
  const pending = S.orders.filter(o=>o.status==='en_attente'||(o.status==='payee'&&!o.stockApplied)).length;
  const panes = {dash:paneDash, products:paneProducts, bundles:paneBundles, orders:paneOrders, promos:panePromos, payments:panePayments, team:paneTeam};
  return `<div class="admin"><nav class="side" aria-label="Gestion">${TABS.map(([k,l])=>`<button data-a="tab" data-v="${k}" ${S.tab===k?'aria-current="page"':''}>${l}${k==='orders'&&pending?`<span class="pill warn">${pending}</span>`:''}</button>`).join('')}</nav>
    <section>${panes[S.tab]()}</section></div>`;
}
function paneDash(){
  const valid = S.orders.filter(o=>o.status!=='annulee' && o.status!=='en_attente');
  const revenue = valid.reduce((s,o)=>s+o.total,0);
  const avg = valid.length ? revenue/valid.length : 0;
  const low = S.products.filter(p=>p.stock<=(p.lowStock||5));
  const toValidate = S.orders.filter(o=>o.status==='payee'&&!o.stockApplied);
  const days = [...Array(14)].map((_,i)=>{ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-13+i); return d; });
  const vals = days.map(d=>valid.filter(o=>{ const t=new Date(o.createdAt); t.setHours(0,0,0,0); return t.getTime()===d.getTime(); }).reduce((s,o)=>s+o.total,0));
  const max = Math.max(...vals,1);
  const bw = 100/14;
  const bars = `<svg class="bars" viewBox="0 0 100 60" preserveAspectRatio="none" role="img" aria-label="Chiffre d’affaires des 14 derniers jours">${vals.map((v,i)=>`<rect x="${i*bw+bw*.18}" y="${56-v/max*52}" width="${bw*.64}" height="${Math.max(v/max*52,.6)}" rx=".8" fill="${i===13?'var(--saffron)':'var(--indigo)'}"><title>${days[i].toLocaleDateString('fr-FR')} : ${fmt(v)}</title></rect>`).join('')}</svg>
    <div class="row muted small" style="justify-content:space-between"><span style="flex:0">${days[0].toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}</span><span style="flex:0">Aujourd’hui</span></div>`;
  const sold = {}; valid.forEach(o=>o.items.forEach(i=>{ sold[i.name]=(sold[i.name]||0)+i.qty; }));
  const top = Object.entries(sold).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `${toValidate.length?`<div class="alert"><span><b>${toValidate.length} commande${toValidate.length>1?'s':''} payée${toValidate.length>1?'s':''}</b> à valider : le stock sera déduit.</span><button class="btn primary sm" data-a="validateAll">Valider et déstocker</button></div>`:''}
    <div class="kpis"><div class="kpi"><span>Chiffre d’affaires</span><b>${fmt(revenue)}</b></div><div class="kpi"><span>Commandes payées</span><b>${valid.length}</b></div>
    <div class="kpi"><span>Panier moyen</span><b>${fmt(avg)}</b></div><div class="kpi"><span>Stock bas</span><b style="color:${low.length?'var(--danger)':'inherit'}">${low.length}</b></div></div>
    <div class="two"><div class="panel"><h3>Ventes des 14 derniers jours</h3>${bars}</div>
    <div class="panel"><h3>Meilleures ventes</h3>${top.length?top.map(([n,q])=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span style="flex:1">${esc(n)}</span><b style="flex:0">${q}</b></div>`).join(''):'<p class="muted">Les ventes apparaîtront ici.</p>'}</div></div>
    <div class="panel"><h3>Stock à réapprovisionner</h3>${low.length?`<div class="tbl-wrap"><table><thead><tr><th>Produit</th><th>SKU</th><th>Stock</th></tr></thead><tbody>${low.map(p=>`<tr class="click" data-a="editProduct" data-id="${p.id}"><td>${esc(p.name)}</td><td class="muted">${esc(p.sku)}</td><td><span class="pill ${p.stock<=0?'bad':'warn'}">${p.stock}</span></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Tout le stock est au-dessus du seuil d’alerte.</p>'}</div>`;
}

  const list = S.products.filter(p=>!q || (p.name+' '+p.sku+' '+p.category).toLowerCase().includes(q));

    ${list.map(p=>`<tr class="click" data-a="editProduct" data-id="${p.id}"><td><div class="li-img" style="width:40px;height:40px;font-size:20px">${pImg(p)}</div></td><td><b>${esc(p.name)}</b><div class="muted small">${esc(p.sku)}</div></td><td>${esc(p.category)}</td><td>${fmt(p.price)}</td>

function paneBundles(){

  <div class="panel tbl-wrap">${S.bundles.length?`<table><thead><tr><th>Lot</th><th>Contenu</th><th>Prix du lot</th><th>Économie client</th><th>Disponible</th><th>En vente</th></tr></thead><tbody>

function bundleForm(b){
  const isNewB = !b; b = b || {name:'',emoji:'🎁',description:'',price:'',items:[],active:true};
  let rows = (b.items||[]).map(i=>({...i})); if(!rows.length) rows = [{id:'',qty:1},{id:'',qty:1}];

  const read = ()=>{ f={name:$('#bf-name').value.trim(), emoji:$('#bf-emoji').value.trim()||'🎁', description:$('#bf-desc').value.trim(), price:$('#bf-price').value, active:$('#bf-active').checked};
    rows=[...document.querySelectorAll('.b-row')].map(r=>({id:r.querySelector('select').value, qty:Math.max(1,parseInt(r.querySelector('input').value)||1)})); };
  const sum = ()=>rows.reduce((t,r)=>{ const p=S.products.find(x=>x.id===r.id); return t+(p?p.price*r.qty:0); },0);
  const draw = ()=>{
    $('#overlay').innerHTML = `<div class="scrim" data-a="closeAll"><div class="modal wide" role="dialog" aria-modal="true" aria-label="${isNewB?'Nouveau lot':'Modifier le lot'}">
    <div class="m-h"><h2>${isNewB?'Nouveau lot':'Modifier le lot'}</h2><button class="x" data-a="closeAll" aria-label="Fermer">×</button></div>
    <div class="m-b"><div class="row"><div class="field" style="flex:3 1 240px"><label for="bf-name">Nom du lot</label><input class="input" id="bf-name" value="${esc(f.name)}" placeholder="ex. Pack chantier, Kit cuisine"></div>
      <div class="field" style="flex:1 1 90px"><label for="bf-emoji">Icône</label><input class="input" id="bf-emoji" value="${esc(f.emoji)}" maxlength="4"></div></div>
      <div class="field"><label for="bf-desc">Description (facultatif)</label><input class="input" id="bf-desc" value="${esc(f.description)}"></div>
      <label style="font-size:13px;font-weight:600;color:var(--muted)">Contenu du lot</label>
      <div style="margin:8px 0 6px">${rows.map((r,i)=>`<div class="b-row"><select class="input" aria-label="Produit ${i+1}">${opts(r.id)}</select><input class="input" inputmode="numeric" value="${r.qty}" aria-label="Quantité"><button class="btn ghost" data-bf="rm" data-i="${i}" aria-label="Retirer">×</button></div>`).join('')}</div>
      <button class="btn ghost sm" data-bf="addRow">Ajouter un produit</button>
      <div class="row" style="margin-top:16px;align-items:flex-end"><div class="field"><label>Prix normal des articles</label><div class="price" id="bf-sum">${fmt(sum())}</div></div>
      <div class="field"><label for="bf-price">Prix du lot (${esc(S.settings.currency)})</label><input class="input" id="bf-price" inputmode="numeric" value="${esc(f.price)}"></div></div>

      <div class="small" id="bf-err" style="color:var(--danger);margin-top:8px"></div></div>

    $('#overlay').querySelectorAll('.b-row select,.b-row input').forEach(x=>x.addEventListener('change',()=>{ read(); $('#bf-sum').textContent=fmt(sum()); }));

function confirmTwice(btn){ if(btn.dataset.armed){ return true; } btn.dataset.armed='1'; btn.textContent='Confirmer la suppression'; return false; }
function compress(file){
  return new Promise(res=>{
    const r = new FileReader(); r.onload = ()=>{ const img = new Image(); img.onload = ()=>{
      const s = 480, c = document.createElement('canvas'); const k = Math.min(1, s/Math.max(img.width,img.height));
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.78)); }; img.src = r.result; }; r.readAsDataURL(file);
  });
}

async function setOrderStatus(o, st){
  const upd = {status:st, updatedAt:Date.now()};
  if(st!=='annulee' && st!=='en_attente' && !o.stockApplied){
    for(const i of expandItems(o.items)){ const p=S.products.find(x=>x.id===i.id); if(p) await patch('products',p.id,{stock:Math.max(0,p.stock-i.qty)}); }
    upd.stockApplied = true;
    if(o.payment?.status==='à encaisser') upd.payment = {...o.payment, status:'encaissé'};
  }
  if(st==='annulee' && o.stockApplied){
    for(const i of expandItems(o.items)){ const p=S.products.find(x=>x.id===i.id); if(p) await patch('products',p.id,{stock:p.stock+i.qty}); }
    upd.stockApplied = false;
  }
  await patch('orders', o.id, upd);
}

    <div class="field"><label for="st-free">Livraison offerte dès</label><input class="input" id="st-free" inputmode="numeric" value="${esc(st.freeFrom)}"></div>
    <div class="field"><label for="st-cur">Devise</label><input class="input" id="st-cur" value="${esc(st.currency)}"></div>
    <div class="field"><label for="st-phone">Téléphone boutique</label><input class="input" id="st-phone" value="${esc(st.phone)}"></div></div>
  </div>
  <div style="margin-top:16px;display:flex;justify-content:flex-end"><button class="btn primary" data-a="saveSettings">Enregistrer les réglages</button></div>`;
}
async function saveSettings(){
  const s = structuredClone(S.settings), v = id=>($(id)?.value||'').trim();
  s.shopName=v('#st-name')||'foûfoûni-Market'; s.city=v('#st-city'); s.tagline=v('#st-tag'); s.intro=v('#st-intro'); s.currency=v('#st-cur')||'FCFA'; s.phone=v('#st-phone');
  s.deliveryFee=Number(v('#st-fee'))||0; s.freeFrom=Number(v('#st-free'))||0; s.testMode=$('#st-test').checked;
  document.querySelectorAll('[data-proc]').forEach(i=>{ s.processors[i.dataset.proc].account=i.value.trim(); });
  document.querySelectorAll('[data-proc-on]').forEach(i=>{ s.processors[i.dataset.procOn].enabled=i.checked; });
  try{ await put('settings','main',s); toast('Réglages enregistrés'); }catch(e){ dbErr(e); toast('Enregistrement impossible : réservé aux gérants.'); }
}

/* --- Équipe --- */
function paneTeam(){
  const mem = S.team.members||[];
  const sales = {}; S.orders.filter(o=>o.channel==='caisse').forEach(o=>{ sales[o.cashier]=(sales[o.cashier]||0)+o.total; });
  return `<h2 style="font-size:24px;margin-bottom:16px">Équipe</h2>
  <div class="panel"><h3>Membres et rôles</h3>
  ${mem.length?`<div class="tbl-wrap"><table><thead><tr><th>Membre</th><th>Rôle</th><th>Ventes en caisse</th><th></th></tr></thead><tbody>${mem.map((m,i)=>`<tr><td>${esc(S.names[m.id]||'…')}${m.id===S.uid?' <span class="pill info">vous</span>':''}</td>
    <td><select class="input" data-a="role" data-i="${i}" aria-label="Rôle">${ROLES.map(r=>`<option ${r===m.role?'selected':''}>${r}</option>`).join('')}</select></td><td>${fmt(sales[m.id]||0)}</td><td><button class="btn sm ghost" data-a="rmMember" data-i="${i}">Retirer</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Ajoutez les personnes qui travaillent dans la boutique.</p>'}
  ${userCap?`<div class="field" style="margin-top:16px"><label for="tm-q">Ajouter un membre</label><input class="input" id="tm-q" placeholder="Rechercher par nom" autocomplete="off"></div><div id="tm-res"></div>`:'<p class="muted small">L’ajout de membres est disponible une fois la boutique publiée et partagée.</p>'}
  </div>
  <div class="panel"><h3>Qui peut faire quoi</h3><p class="muted" style="margin:0">Les droits réels se règlent dans le menu de partage de la page : les <b>Éditeurs</b> accèdent à la Gestion et à la Caisse (catalogue, prix, codes promo, paiements) ; les <b>Contributeurs</b> peuvent commander en ligne ; les simples lecteurs consultent le catalogue. Les rôles ci-dessus servent à organiser l’équipe et à suivre les ventes par personne.</p></div>`;
}
async function resolveNames(){
  if(!userCap) return;
  const ids = (S.team.members||[]).map(m=>m.id).filter(id=>!(id in S.names));
  if(!ids.length) return;
  try{ const ps = await userCap.profiles(ids); ids.forEach(id=>S.names[id]=(ps[id]&&ps[id].name)||'Membre'); schedule(); }catch(e){}
}
async function saveTeam(members){ try{ await put('settings','team',{members}); }catch(e){ dbErr(e); toast('Modification impossible.'); } }
let tmTimer;
async function teamSearch(q){
  const box = $('#tm-res'); if(!box || !userCap) return;
  try{
    const hits = await userCap.search(q);
    const have = new Set((S.team.members||[]).map(m=>m.id));
    box.innerHTML = hits.filter(h=>!have.has(h.id)).slice(0,6).map(h=>{ S.names[h.id]=h.name||'Membre'; return `<div class="row" style="align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><span style="flex:1"></span><button class="btn sm primary" data-a="addMember" data-id="${esc(h.id)}" style="flex:0">Ajouter</button></div>`; }).join('') || '<p class="muted small">Aucune personne trouvée.</p>';
    box.querySelectorAll('[data-a="addMember"]').forEach(b=>{ b.parentElement.firstElementChild.textContent = S.names[b.dataset.id]; });
  }catch(e){}
}

/* --- exports & impression --- */
function csv(rows){ return '\ufeff'+rows.map(r=>r.map(c=>{ const s=String(c??''); return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';')).join('\n'); }
async function save(filename, data){ if(!dl){ toast('Le téléchargement n’est pas disponible ici.'); return; } try{ await dl.save({filename, data}); }catch(e){ if(e.code!=='declined') toast('Téléchargement impossible.'); } }
function standalone(title, inner){
  const css = [...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  return `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(title)}</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"><style>${css} body{padding:24px} #print-area{display:block}</style></head><body data-theme="light"><div id="print-area" style="display:block">${inner}</div><script>document.documentElement.dataset.theme='light'<\/script></body></html>`;
}
function doPrint(inner){ $('#print-area').innerHTML = inner; try{ window.print(); }catch(e){ toast('Impression non disponible ici : utilisez Télécharger.'); } }

/* ============ événements ============ */
function closeAll(){ $('#overlay').innerHTML=''; CO=null; }
let tt;
function toast(m){ clearTimeout(tt); document.querySelector('.toast')?.remove(); const d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent=m; document.body.appendChild(d); tt=setTimeout(()=>d.remove(),2600); }

document.addEventListener('input', e=>{
  const k = e.target.dataset.in;
  if(k==='q'){ S.q = e.target.value; if(S.view!=='shop'){ S.view='shop'; } schedule(); }
  if(k==='aq'){ S.aq = e.target.value; schedule(); }
  if(k==='pq'){ S.pq = e.target.value; schedule(); }
  if(e.target.id==='tm-q'){ clearTimeout(tmTimer); const v=e.target.value; tmTimer=setTimeout(()=>teamSearch(v),250); }
});
document.addEventListener('focusin', e=>{ if(e.target.id==='tm-q' && !e.target.value) teamSearch(''); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && $('#overlay').innerHTML) closeAll();
  if(e.key==='Enter' && e.target.id==='aq' && S.view==='pos'){
    const v = S.aq.trim().toLowerCase(); const p = S.products.find(x=>(x.sku||'').toLowerCase()===v) || (S.products.filter(x=>x.name.toLowerCase().includes(v)).length===1 ? S.products.find(x=>x.name.toLowerCase().includes(v)) : null);
    if(p){ addToCart(p.id,1,'pos'); S.aq=''; schedule(); }
  }
  if(e.key==='Enter' && e.target.id && e.target.id.startsWith('promo-')){ e.preventDefault(); e.target.nextElementSibling?.click(); }
});
document.addEventListener('change', async e=>{
  const t = e.target, a = t.dataset.a;
  if(a==='togglePromo'){ const p=S.promos.find(x=>x.code===t.dataset.id); try{ await patch('promos',p.code,{active:t.checked}); await patch('promo-lookup',await hashCode(p.code),{active:t.checked}); }catch(err){ dbErr(err); } }
  if(a==='selPromo'){ t.checked?S.selPromos.add(t.dataset.id):S.selPromos.delete(t.dataset.id); schedule(); }
  if(a==='selAll'){ S.selPromos = t.checked ? new Set(S.promos.map(p=>p.code)) : new Set(); schedule(); }
  if(t.dataset.fin==='acc'){ S.trAcc=t.value; schedule(); }
  if(t.dataset.fin==='type'){ S.trType=t.value; schedule(); }
  if(a==='role'){ const m=structuredClone(S.team.members); m[+t.dataset.i].role=t.value; saveTeam(m); }
});
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a;
  if((a==='closeAll') && e.target!==el && el.classList.contains('scrim')) return;
  if(a==='closeAll' && el.classList.contains('drawer-wrap') && e.target!==el) return;
  const id = el.dataset.id;
  switch(a){
    case 'closeAll': closeAll(); break;
    case 'go': S.view=el.dataset.v; S.aq=''; closeAll(); schedule(); window.scrollTo(0,0); break;
    case 'cat': S.cat=el.dataset.v; schedule(); if(el.closest('.sale')) setTimeout(()=>$('#catalogue')?.scrollIntoView({behavior:'smooth'}),60); break;
    case 'clearSearch': S.q=''; S.cat='Tout'; schedule(); break;
    case 'scroll': $('#catalogue').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'}); break;
    case 'cart': openCart(); break;
    case 'add': addToCart(id); break;
    case 'product': {
      const p = S.products.find(x=>x.id===id); if(!p) break;
      const related = S.products.filter(x=>x.id!==p.id && x.active!==false && x.category===p.category).sort((a,b)=>(b.stock>0)-(a.stock>0)).slice(0,6);
      const inBundles = S.bundles.filter(b=>b.active!==false && (b.items||[]).some(i=>i.id===p.id) && bundleInfo(b).ok);
      $('#overlay').innerHTML = `<div class="scrim" data-a="closeAll"><div class="modal wide" role="dialog" aria-modal="true" aria-label="${esc(p.name)}"><div class="m-h"><h2>${esc(p.name)}</h2><button class="x" data-a="closeAll" aria-label="Fermer">×</button></div>
        <div class="m-b"><div class="row" style="align-items:flex-start"><div class="thumb" style="flex:1 1 260px;border-radius:14px;font-size:110px">${pImg(p)}</div>
        <div style="flex:1 1 260px"><span class="muted small">${esc(p.category)} · ${esc(p.sku)}</span><p class="price" style="font-size:28px;margin:8px 0">${fmt(p.price)}${p.comparePrice>p.price?`<span class="strike">${fmt(p.comparePrice)}</span>`:''}</p>
        <p>${esc(p.description||'')}</p><p>${p.stock>0?`<span class="pill ok">En stock · ${p.stock}</span>`:'<span class="pill bad">Rupture de stock</span>'} ${isNew(p)?'<span class="pill info">Nouveau</span>':''}</p>
        ${p.bulkMin>1&&p.bulkPrice>0?`<p class="bulk" style="font-size:14px">Achat groupé : ${fmt(p.bulkPrice)} l’unité dès ${p.bulkMin} unités, appliqué automatiquement dans le panier.</p>`:''}
        <button class="btn primary block" data-a="addClose" data-id="${p.id}" ${p.stock<=0?'disabled':''}>Ajouter au panier</button>
        ${inBundles.length?`<div style="margin-top:14px">${inBundles.map(b=>`<button class="btn ghost block" style="margin-top:8px" data-a="addBundle" data-id="${b.id}">Aussi en lot : ${esc(b.name)} · ${fmt(b.price)}</button>`).join('')}</div>`:''}</div></div>
        ${related.length?`<h3 style="margin:26px 0 12px;font-size:24px">Dans la même catégorie</h3><div class="related">${related.map(miniCard).join('')}</div>`:''}</div></div></div>`;
      break; }
    case 'addClose': addToCart(id); closeAll(); break;
    case 'qty': changeQty('cart', id, Number(el.dataset.d)); if(!S.cart.length) openCart(); break;
    case 'addBundle': addBundle(id); break;
    case 'posBundle': addBundle(id,'pos'); break;
    case 'copyCode': { const c=el.dataset.v; try{ await navigator.clipboard.writeText(c); toast(`Code ${c} copié : collez-le dans le panier`); }catch(err){ toast(`Votre code : ${c}`); } break; }
    case 'featurePromo': { const p=S.promos.find(x=>x.code===id); const cur=S.settings.featuredPromo; const s2=structuredClone(S.settings); s2.featuredPromo = (cur&&cur.code===id) ? null : {code:p.code,type:p.type,value:p.value,minOrder:p.minOrder||0,expiresAt:p.expiresAt||''}; try{ await put('settings','main',s2); toast(s2.featuredPromo?`${id} affiché sur la boutique`:'Offre retirée de la boutique'); }catch(err){ dbErr(err); toast('Réservé au gérant.'); } break; }
    case 'newBundle': bundleForm(null); break;
    case 'editBundle': bundleForm(S.bundles.find(x=>x.id===id)); break;
    case 'applyPromo': {
      const tg = el.dataset.t, inp = $('#promo-'+tg), msg = $('#promo-msg-'+tg);
      const sub = computeTotals(tg==='pos'?S.pos:S.cart, null, 'retrait').subtotal;
      el.disabled = true; const r = await validatePromo(inp.value, sub); el.disabled=false;
      if(r.err){ msg.textContent = r.err; break; }
      if(tg==='pos') S.posPromo=r.promo; else S.appliedPromo=r.promo; toast('Code appliqué'); schedule();
      if(tg==='cart'){ $('#drawer-body').innerHTML = cartBody(); }
      break; }
    case 'removePromo': if(el.dataset.t==='pos') S.posPromo=null; else S.appliedPromo=null; schedule(); break;
    case 'checkout': if(!enabledProcs().length){ toast('Aucun moyen de paiement actif pour le moment.'); break; } openCheckout(); break;
    case 'coDelivery': readCO(); CO.delivery=el.dataset.v; drawCheckout(); break;
    case 'coMethod': CO.method=el.dataset.v; drawCheckout(); break;
    case 'coBack': readCO(); CO.step--; drawCheckout(); break;
    case 'coNext': coNext(); break;
    case 'receipt': { const o=S.orders.find(x=>x.id===id); if(o) showReceipt(o,false); break; }
    case 'printReceipt': { const o = S.orders.find(x=>x.id===id) || window._lastReceipt; if(o) doPrint(receiptHTML(o)); break; }
    case 'dlReceipt': { const o = S.orders.find(x=>x.id===id) || window._lastReceipt; if(o) save(`recu-${o.number}.html`, standalone('Reçu '+o.number, receiptHTML(o))); break; }
    case 'posAdd': addToCart(id,1,'pos'); break;
    case 'posQty': changeQty('pos', id, Number(el.dataset.d)); break;
    case 'posTab': S.posTab=el.dataset.v; S.pq=''; schedule(); break;
    case 'finAction': finForm(el.dataset.v); break;
    case 'finOpen': finOpening(); break;
    case 'reminders': openReminders(); break;
    case 'delMove': { if(!confirmTwice(el)) break; const m=S.moves.find(x=>x.id===id); try{ const grp = m.group ? S.moves.filter(x=>x.group===m.group) : [m]; for(const x of grp) await del('fin-moves', x.id); const le=S.ledger.find(l=>l.moveId===id); if(le) await del('fin-ledger', le.id); toast('Écriture supprimée'); }catch(err){ dbErr(err); } break; }
    case 'newParty': partyForm(el.dataset.v, null); break;
    case 'partyDetail': partyDetail(el.dataset.v, id); break;
    case 'exportMoves': save('journal-tresorerie.csv', csv([['Date','Type','Libellé','Catégorie','Compte','Montant','Référence'], ...S.moves.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(m=>[m.date,MOVE_TYPES[m.type],m.label,m.category,ACCOUNTS[m.account],m.amount,m.ref])])); break;
    case 'exportParties': { const tp=el.dataset.v, list=tp==='client'?S.clients:S.suppliers; save(tp==='client'?'clients.csv':'fournisseurs.csv', csv([['Nom','Téléphone','E-mail','Adresse','Produits','Solde dû','Note'], ...list.map(x=>[x.name,x.phone,x.email,x.address,x.products,partyBalance(tp,x.id),x.note])])); break; }
    case 'posClear': S.pos=[]; S.posPromo=null; schedule(); break;
    case 'posPay': posPay(); break;
    case 'tab': S.tab=el.dataset.v; S.aq=''; schedule(); break;
    case 'newProduct': S.view==='admin'||(S.view='admin', S.tab='products'); productForm(null); schedule(); break;
    case 'editProduct': productForm(S.products.find(x=>x.id===id)); break;
    case 'ofilter': S.orderFilter=el.dataset.v; schedule(); break;
    case 'orderDetail': orderDetail(S.orders.find(x=>x.id===id)); break;
    case 'validateAll': { el.disabled=true; const list=S.orders.filter(o=>o.status==='payee'&&!o.stockApplied); try{ for(const o of list) await setOrderStatus(o,'preparation'); toast(`${list.length} commande(s) passée(s) en préparation`); }catch(err){ dbErr(err); toast('Validation impossible.'); el.disabled=false; } break; }
    case 'newPromo': promoForm(); break;
    case 'delPromo': { if(!confirmTwice(el)) break; try{ await del('promos',id); await del('promo-lookup', await hashCode(id)); S.selPromos.delete(id); toast('Code supprimé'); }catch(err){ dbErr(err); } break; }
    case 'tickets': openTickets(); break;
    case 'printTickets': doPrint(`<div class="tickets">${S.promos.filter(p=>S.selPromos.has(p.code)).map(ticketHTML).join('')}</div>`); break;
    case 'dlTickets': save('tickets-promo-foufouni.html', standalone('Tickets promo', `<div class="tickets">${S.promos.filter(p=>S.selPromos.has(p.code)).map(ticketHTML).join('')}</div>`)); break;
    case 'saveSettings': saveSettings(); break;
    case 'addMember': { const m=[...(S.team.members||[]), {id, role:'Vendeur'}]; await saveTeam(m); $('#tm-res').innerHTML=''; $('#tm-q').value=''; toast('Membre ajouté'); break; }
    case 'rmMember': { const m=structuredClone(S.team.members); m.splice(+el.dataset.i,1); saveTeam(m); break; }
    case 'exportOrders': save('commandes-foufouni.csv', csv([['N°','Date','Canal','Client','Téléphone','Livraison','Articles','Sous-total','Remise','Code promo','Livraison (frais)','Total','Paiement','Réf.','Statut'],
      ...S.orders.map(o=>[o.number,new Date(o.createdAt).toLocaleString('fr-FR'),o.channel,o.customer?.name,o.customer?.phone,o.delivery,o.items.map(i=>i.qty+'x '+i.name).join(' | '),o.subtotal,o.discount,o.promoCode,o.shipping,o.total,o.payment?.method,o.payment?.ref,STATUS[o.status]?.label])])); break;
    case 'exportProducts': save('produits-foufouni.csv', csv([['Nom','SKU','Catégorie','Prix','Prix barré','Stock','Seuil alerte','En vente'], ...S.products.map(p=>[p.name,p.sku,p.category,p.price,p.comparePrice,p.stock,p.lowStock,p.active!==false?'oui':'non'])])); break;
  }
});

renderTop(); renderBnav();
</script>
<script src="adapter.js"></script>
